<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div id="app">

</div>

<script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
<script>
    let model=[];

    function updateView() {
        document.getElementById("app").innerHTML = `
         <input id="bgColor" type="text" placeholder="Enter a background color"/>
        <input id="fColor" type="text" placeholder="Enter a font color"/>
        <input id="textInput" type="text" placeholder="Enter a text"/>
        <button id="submit" onclick="sumbitSquare()">Submit</button>
        <div>
          ${drawList()}
        </div>
           `
    }

    async function sumbitSquare() {
        model.index += 1;
        model.bgColor = document.getElementById("bgColor").value;
        model.fColor = document.getElementById("fColor").value;
        model.Content = document.getElementById("textInput").value;
        axios.post("/square", model)
            .then(res => {
                console.log(res.data);
            }).catch(err => console.log(err))
            .finally(() => {
                console.log("SumbitSquare complete!");
            });
        updateView();

    }
    function drawList() {
        getSquare();
        console.log(model)
        let html;
        for (let i = 0; i < model.length; i++) {
            html += `<ul>
                <li>${model[i].Content}</li>
                    </ul>`
        }
        return html;
    }

     async function getSquare() {
        axios.get("/square").then(res => {
            model = (res.data);
        })
            .catch(err => console.log(err))
    }

    updateView();

</script>
</body>
</html>
